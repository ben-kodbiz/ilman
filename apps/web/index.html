<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ilman — Islamic Companion</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f6f4ef; color: #1c1b18; display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 720px; padding: 1rem; min-height: 100vh;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between;
           padding-bottom: .6rem; border-bottom: 1px solid #e3ddd2; }
  h1 { font-size: 1.15rem; margin: .4rem 0 .2rem; }
  .sub { color: #6b675e; font-size: .8rem; }
  #mode-pill {
    font-size: .78rem; padding: .25rem .7rem; border-radius: 999px;
    background: #efe9dc; color: #5b4a26; min-width: 92px; text-align: center;
  }
  #mode-pill.crisis { background: #7b241c; color: #fff; }
  #chat { flex: 1; overflow-y: auto; padding: 1rem .2rem; }
  .msg { max-width: 85%; margin: .5rem 0; padding: .7rem .95rem; border-radius: 14px;
         line-height: 1.55; font-size: .95rem; white-space: pre-wrap; }
  .msg.user { margin-left: auto; background: #2e6b4f; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { background: #fff; border: 1px solid #e3ddd2; border-bottom-left-radius: 4px; }
  .msg.crisis { background: #fdf3f2; border-color: #c0392b; }
  .cites { font-size: .72rem; color: #7a5c2e; margin-top: .45rem; }
  form { display: flex; gap: .5rem; padding-top: .6rem; border-top: 1px solid #e3ddd2; }
  input[type=text] { flex: 1; padding: .75rem .95rem; border: 1px solid #d8d1c3;
                     border-radius: 12px; font-size: 1rem; background: #fff; color: inherit; }
  button { padding: .75rem 1.1rem; border: 0; border-radius: 12px; cursor: pointer;
           background: #2e6b4f; color: #fff; font-size: .95rem; }
  .foot { display: flex; gap: .8rem; font-size: .72rem; color: #8a8578;
          padding: .5rem 0; flex-wrap: wrap; }
  .foot button { background: none; color: #7a5c2e; padding: 0; font-size: .72rem;
                 text-decoration: underline; cursor: pointer; }
  @media (prefers-color-scheme: dark) {
    body { background: #191713; color: #eae6dd; }
    .msg.bot { background: #211f1a; border-color: #34302a; }
    .msg.crisis { background: #2c1a17; }
    input[type=text] { background: #211f1a; border-color: #3a352d; }
    #mode-pill { background: #3a352d; color: #d9cfb4; }
    header { border-color: #34302a; } form { border-color: #34302a; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Ilman</h1>
      <div class="sub">an Islamic companion — listens first</div>
    </div>
    <div id="mode-pill">● Q&amp;A</div>
  </header>

  <div id="chat"></div>

  <form id="ask">
    <input type="text" id="q" placeholder="Talk to me, or ask anything…" autofocus autocomplete="off">
    <button type="submit">Send</button>
  </form>

  <div class="foot">
    <button id="clear-chat">Clear conversation</button>
    <button id="view-mem">View memories</button>
    <button id="clear-mem">Clear memories</button>
    <button id="toggle-mem">Disable memory</button>
  </div>
</main>

<script>
const API = location.protocol === "file:" ? "http://127.0.0.1:8017" : "";
const SESSION = "web-" + Math.random().toString(36).slice(2, 9);
const $chat = document.getElementById("chat");
const $pill = document.getElementById("mode-pill");

const MODE_LABEL = {
  companion: "● Companion", qa: "● Q&A", study: "● Study",
  reflection: "● Reflection", dua: "● Dua", crisis: "● Crisis support",
};

function addMsg(cls, text, cites) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  if (cites && cites.length) {
    const c = document.createElement("div");
    c.className = "cites";
    c.textContent = "sources: " + cites.join(", ");
    div.appendChild(c);
  }
  $chat.appendChild(div);
  $chat.scrollTop = $chat.scrollHeight;
}

function setMode(mode) {
  $pill.textContent = MODE_LABEL[mode] || "● Q&A";
  $pill.className = mode === "crisis" ? "crisis" : "";
}

document.getElementById("ask").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  addMsg("user", q);
  document.getElementById("q").value = "";
  try {
    const r = await fetch(API + "/api/v1/companion", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: SESSION, message: q }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    setMode(d.mode);
    addMsg(d.mode === "crisis" ? "crisis" : "bot", d.answer, d.citations);
  } catch (err) {
    addMsg("bot", "I'm having trouble reaching my backend (" + err + "). Is the server running?");
  }
});

document.getElementById("clear-chat").addEventListener("click", async () => {
  await fetch(API + "/api/v1/companion/state/" + SESSION, { method: "DELETE" });
  $chat.innerHTML = ""; setMode("qa");
});

document.getElementById("view-mem").addEventListener("click", async () => {
  const d = await (await fetch(API + "/api/v1/memories")).json();
  const facts = (d.facts || []).map(f => "• " + f.fact).join("\n") || "(no saved facts)";
  const on = d.memory_enabled ? "enabled" : "disabled";
  addMsg("bot", "Memory is " + on + ". Saved facts:\n" + facts);
});

document.getElementById("clear-mem").addEventListener("click", async () => {
  if (!confirm("Clear ALL saved memories? This cannot be undone.")) return;
  await fetch(API + "/api/v1/memories", { method: "DELETE" });
  addMsg("bot", "All memories cleared.");
});

document.getElementById("toggle-mem").addEventListener("click", async () => {
  const d = await (await fetch(API + "/api/v1/memories")).json();
  const path = d.memory_enabled ? "disable" : "enable";
  const r = await (await fetch(API + "/api/v1/memories/" + path, { method: "POST" })).json();
  document.getElementById("toggle-mem").textContent =
    r.memory_enabled ? "Disable memory" : "Enable memory";
  addMsg("bot", "Memory is now " + (r.memory_enabled ? "enabled" : "disabled") + ".");
});
</script>
</body>
</html>
