# fixme_v3.1 §34 — entailment failures (similarity != entailment, §22).
category: entailment
cases:
  - id: ent_001
    answer: "Allah mentions remembrance of Allah [quran:13:28]. Therefore, remembrance cures depression."
    passages: [{citation_id: quran:13:28, text: "Those who have believed and whose hearts are assured by the remembrance of Allah. Unquestionably, by the remembrance of Allah hearts are assured."}]
    # §9: the INFERENCE claim must never be supported; premise A may be.
    expect: {no_inference_supports: true}
  - id: ent_002
    answer: "The Quran mentions hardship [quran:94:6]. Thus, hardship is always followed by relief within days."
    passages: [{citation_id: quran:94:6, text: "Indeed, with hardship [will be] ease."}]
    # premise A ('mentions hardship') may be supported; the invented
    # specificity ('within days') rides the inference clause and must fail
    expect: {no_inference_supports: true}
